[project]
name = "emoji-hero"
version = "0.1.0"
description = "Chat-powered custom emoji generator for Slack"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "h2>=4.4.1",
    "httpx>=0.28.1",
    "openai>=3.8.0",
    "pydantic>=2.13.5",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pillow>=12.3.0",
    "posthog>=7.47.0",
    "pydantic-ai>=2.39.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "tavily-python>=0.8.1",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-json-report>=1.5.0",
]
